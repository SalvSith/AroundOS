[panel]
widgets_left=launchers window-list
widgets_right=clock netman
# Shared by both native launcher widgets; the surface module keeps only Apps on top.
launchers=aroundos-launchpad x-www-browser x-terminal-emulator aroundos-files aroundos-editor aroundos-settings aroundos-sleep
position=top
offset=24
exclusive=false
layer=top
autohide=false
# Negative duration skips the stock interpolation branch (zero can divide by zero).
autohide_duration=-1
icon_size=32
monitor=HDMI-A-1

[dock]
widgets_left=launchers
widgets_right=
launchers=aroundos-launchpad x-www-browser x-terminal-emulator aroundos-files aroundos-editor aroundos-settings aroundos-sleep
position=bottom
offset=24
exclusive=false
layer=bottom
autohide=false
icon_size=48
monitor=HDMI-A-1

[window-list]
icons_only=true
max_width=60
spacing=4

[clock]
format=%H:%M
